<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Every Charm - Catalogue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #fdf6f9; color: #333; }
    header { background: #ff7aa2; color: #fff; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.8rem; }
    nav a { color: #fff; text-decoration: none; margin-left: 20px; font-weight: bold; }
    nav a:hover { text-decoration: underline; }

    .products {
      padding: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      padding: 20px;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product-card h3 { margin: 10px 0; }
    .product-card p { margin: 5px 0; font-size: 0.95rem; }
    .price { font-weight: bold; color: #ff7aa2; margin-top: 8px; }
    .stock { font-size: 0.9rem; color: #555; }

    footer { background: #333; color: #fff; text-align: center; padding: 20px 10px; margin-top: 40px; font-size: 0.9rem; }
    footer a { color: #ff7aa2; text-decoration: none; margin: 0 8px; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <h1>Every Charm</h1>
    <nav>
      <a href="https://djhpsawse.github.io/every-charm/">Home</a>
      <a href="https://djhpsawse.github.io/every-charm/shop">Shop</a>
      <a href="https://djhpsawse.github.io/every-charm/about">About</a>
      <a href="https://djhpsawse.github.io/every-charm/contact">Contact</a>
    </nav>
  </header>

  <section class="products">

    <div class="product-card">
      <img src="https://raw.githubusercontent.com/djhpsawse/every-charm/main/photos/pink%20diamond.png"
           alt="Rose Quartz Charm bracelet made with soft pink gemstone beads">
      <h3>Rose Quartz Charm</h3>
      <p class="price">£18.00</p>
      <p class="stock">In Stock: 12</p>
    </div>

    <div class="product-card">
      <img src="https://raw.githubusercontent.com/djhpsawse/every-charm/main/photos/princess%20pearl.png"
           alt="Ocean Breeze bracelet featuring blue and white natural stone beads">
      <h3>Ocean Breeze</h3>
      <p class="price">£22.00</p>
      <p class="stock">In Stock: 7</p>
    </div>

    <div class="product-card">
      <img src="https://raw.githubusercontent.com/djhpsawse/every-charm/main/photos/strawberry%20shortcake.png"
           alt="Midnight Glow bracelet with dark onyx-style beads">
      <h3>Midnight Glow</h3>
      <p class="price">£20.00</p>
      <p class="stock">In Stock: 15</p>
    </div>

    <div class="product-card">
      <img src="https://wallpapercave.com/wp/wp2013748.jpg"
           alt="Custom name bracelet with personalised bead lettering">
      <h3>Custom Name Bracelet</h3>
      <p class="price">From £25.00</p>
      <p class="stock">Made to Order</p>
    </div>

  </section>

  <footer>
    <p>&copy; 2026 Every Charm · All rights reserved.</p>
    <p>
      <a href="https://djhpsawse.github.io/every-charm/contact">Contact</a>
      <a href="https://djhpsawse.github.io/every-charm/shop">Shop</a>
    </p>
  </footer>

</body>
</html>
